  <h1>[Linux] ユーザ管理 <span class="blog-date">2022-02-09</span></h1>
  <h2>ユーザの追加</h2>
  <p>ユーザを追加には<code>useradd</code>を用いる。</p>
  <p>デフォルトでは、ホームディレクトリは作成されない。作成する場合は、<code>-m</code>を指定する。</p>
  <p>Ubuntuなどでは、対話形式の<code>adduser</code>を使うこともできる。</p>
  <pre><code>$ sudo useradd (ユーザ名)</code></pre>
  <h2>ユーザ覧を表示</h2>
  <p>ユーザの一覧は<code>/etc/passwd</code>に格納されている。</p>
  <pre><code>$ cat /etc/passwd</code></pre>
  <h2>ユーザの削除</h2>
  <p>ユーザの削除には<code>userdel</code>を用いる。</p>
  <pre><code>$ sudo userdel (ユーザ名)</code></pre>
</body>
