<head>
  <title>MacでGCCを使う</title>
  <created>2022-03-26T20:48:17+09:00</created>
</head>

<body>
  <p>Macの<code>gcc</code>はClangへのエイリアスとなっている。Homebrewで、本来のGCCをインストールできる。</p>
  <code>% brew install gcc</code>
  <p>これでGCCを使えるようになるが、<code>gcc-11</code>としてインストールされるので、<code>.zshrc</code>に以下のエイリアスを登録して、<code>gcc</code>で実行できるようにしておく。
  </p>
  <code>alias gcc='gcc-11'
alias g++='g++-11'</code>
</body>

</html>
